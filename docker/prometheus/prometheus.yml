global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'api-service'
    static_configs:
      - targets: ['api-service:9100']

  - job_name: 'api-worker'
    static_configs:
      - targets: ['api-worker:9100']

  - job_name: 'go-worker'
    static_configs:
      - targets: ['go-worker:9100']

  - job_name: 'python-worker'
    static_configs:
      - targets: ['python-worker:9100']
