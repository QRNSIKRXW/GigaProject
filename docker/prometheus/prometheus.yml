global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'api-service'
    static_configs:
      - targets: ['api-service:8080']

  - job_name: 'api-worker'
    static_configs:
      - targets: ['api-worker:8080']

  - job_name: 'runner-service'
    static_configs:
      - targets: ['runner-service:9000']

  - job_name: 'go-worker'
    static_configs:
      - targets: ['go-worker:9102']

  - job_name: 'python-worker'
    static_configs:
      - targets: ['py-worker:9101']
