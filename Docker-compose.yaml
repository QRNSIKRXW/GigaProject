version: "3.9"

services:
  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - appnet

  api-service:
    build:
      context: ./api-service
      dockerfile: ../docker/go-service/Dockerfile
    container_name: api-service
    restart: always
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    ports:
      - "8000:8080"
    networks:
      - appnet

  api-worker:
    build:
      context: ./api-worker
      dockerfile: ../docker/go-service/Dockerfile
    container_name: api-worker
    restart: always
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    ports:
      - "8081:8080"
    networks:
      - appnet

  go-worker:
    build:
      context: ./go-worker
      dockerfile: ../docker/go-service/Dockerfile
    container_name: go-worker
    restart: always
    environment:
      - REDIS_ADDR=redis:6379
      - RUNNER_URL=http://host.docker.internal:9000
    depends_on:
      - redis
    expose:
      - "9102"
    networks:
      - appnet

  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    container_name: nginx
    restart: always
    depends_on:
      - api-service
    ports:
      - "80:80"
    networks:
      - appnet

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: always
    volumes:
      - "./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
