services:
  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - appnet

  # -------------------------
  # RUNNER SERVICE (API Gateway)
  # -------------------------
  runner-service:
    build:
      context: ./runner-service
      dockerfile: Dockerfile
    container_name: runner-service
    restart: always
    environment:
      - REDIS_ADDR=redis:6379
      - TMP_DIR=/tmp/runner-tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/runner-tmp:/tmp/runner-tmp
    networks:
      - appnet
    ports:
      - "9000:9000"
    depends_on:
      - redis

  # -------------------------
  # GORUNNER POOL (множество контейнеров)
  # -------------------------
  gorunner-0:
    build:
      context: ./docker/go-runner
      dockerfile: Dockerfile
    container_name: gorunner-0
    restart: always
    environment:
      - LANG_TYPE=golang
    tmpfs:
      - /tmp:rw,size=256m,exec
    networks:
      - appnet
    # Убираем command: ["sleep", "infinity"] - используем CMD из Dockerfile

  gorunner-1:
    build:
      context: ./docker/go-runner
      dockerfile: Dockerfile
    container_name: gorunner-1
    restart: always
    environment:
      - LANG_TYPE=golang
    tmpfs:
      - /tmp:rw,size=256m,exec
    networks:
      - appnet

  gorunner-2:
    build:
      context: ./docker/go-runner
      dockerfile: Dockerfile
    container_name: gorunner-2
    restart: always
    environment:
      - LANG_TYPE=golang
    tmpfs:
      - /tmp:rw,size=256m,exec
    networks:
      - appnet

  # -------------------------
  # PYRUNNER POOL (множество контейнеров)
  # -------------------------
  pyrunner-0:
    build:
      context: ./docker/python-runner
      dockerfile: Dockerfile
    container_name: pyrunner-0
    restart: always
    environment:
      - LANG_TYPE=python
    tmpfs:
      - /tmp:rw,size=256m,exec
    networks:
      - appnet

  pyrunner-1:
    build:
      context: ./docker/python-runner
      dockerfile: Dockerfile
    container_name: pyrunner-1
    restart: always
    environment:
      - LANG_TYPE=python
    tmpfs:
      - /tmp:rw,size=256m,exec
    networks:
      - appnet

  # -------------------------
  # API SERVICE
  # -------------------------
  api-service:
    build:
      context: ./api-service
      dockerfile: ../docker/go-service/Dockerfile
    container_name: api-service
    restart: always
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    ports:
      - "8000:8080"
    networks:
      - appnet

  api-worker:
    build:
      context: ./api-worker
      dockerfile: ../docker/go-service/Dockerfile
    container_name: api-worker
    restart: always
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    networks:
      - appnet

  go-worker:
    build:
      context: ./go-worker
      dockerfile: Dockerfile
    container_name: go-worker
    restart: always
    environment:
      - REDIS_ADDR=redis:6379
      - RUNNER_URL=http://runner-service:9000
    depends_on:
      - redis
      - runner-service
    networks:
      - appnet

  py-worker:
    build:
      context: ./py-worker
      dockerfile: Dockerfile
    container_name: py-worker
    restart: always
    environment:
      - REDIS_ADDR=redis:6379
      - RUNNER_URL=http://runner-service:9000
    depends_on:
      - redis
      - runner-service
    networks:
      - appnet

  # -------------------------
  # FRONTEND
  # -------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-builder
    command: ["sh", "-c", "npm run build"]
    volumes:
      - frontend_dist:/app/dist
    networks:
      - appnet

  # -------------------------
  # NGINX
  # -------------------------
  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    container_name: nginx
    restart: always
    depends_on:
      - api-service
      - frontend
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html
    networks:
      - appnet

  # -------------------------
  # PROMETHEUS
  # -------------------------
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: always
    volumes:
      - "./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - appnet

  # -------------------------
  # GRAFANA
  # -------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - appnet

volumes:
  frontend_dist:
  grafana_data:

networks:
  appnet:
    driver: bridge